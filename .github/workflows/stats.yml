name: Cartes de statistiques

# Regenere les images du profil (assets-readme/*.svg) chaque jour : elles vivent dans ce depot, donc elles ne dependent
# d'aucun service externe. Lancement manuel possible depuis l'onglet Actions.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generer les cartes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_stats.py "${{ github.repository_owner }}"
      - name: Enregistrer si elles ont change
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add assets-readme
          git diff --cached --quiet || git commit -m "Cartes de statistiques du jour"
          git push
